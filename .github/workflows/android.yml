name: App Android

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Preparar proyecto Android
        run: |
          npm install
          npm run android:prepare

      # Misma firma en cada compilación para poder actualizar la app sin desinstalarla
      - name: Llave de firma fija
        run: |
          mkdir -p ~/.android
          cp android-src/debug.keystore ~/.android/debug.keystore

      - name: Compilar APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../mallero.apk

      - uses: actions/upload-artifact@v4
        with:
          name: mallero-apk
          path: mallero.apk

      # Publica el APK en "Releases" para descargarlo fácil desde el celular
      - name: Publicar en Releases
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/app-android'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk --yes --cleanup-tag || true
          gh release create apk mallero.apk --target "$GITHUB_SHA" \
            --title "Mallero para Android" \
            --notes "APK compilado automáticamente desde ${GITHUB_SHA::7}. Descarga mallero.apk en el celular e instálalo."
